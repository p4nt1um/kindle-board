# 国内 NTP 源 · systemd-timesyncd drop-in
#
# 适用：Raspberry Pi OS / Debian 13 (systemd 257)，也可用在其它 systemd-timesyncd 主机。
# 用途：无 RTC 的树莓派开机后需要尽快完成首次同步，国内源延迟更低、不受境外链路影响；
#       看板云 API 签名（百度 BCE UTC ±1800s）与 TLS 校验都依赖正确时钟。
#
# 安装（需要 root 权限）：
#   sudo install -d -m 755 /etc/systemd/timesyncd.conf.d
#   sudo install -m 644 -o root -g root deploy/timesyncd-10-local.conf \
#       /etc/systemd/timesyncd.conf.d/10-local.conf
#   sudo systemctl restart systemd-timesyncd
#   timedatectl timesync-status
#
# 回滚：
#   sudo rm /etc/systemd/timesyncd.conf.d/10-local.conf
#   sudo systemctl restart systemd-timesyncd
#
# 选型依据（2026-11-11 在树莓派上实测 UDP 123）：
#   ntp.aliyun.com         203.107.6.88     17.8ms  stratum 2  ← 主
#   ntp1.aliyun.com        47.96.149.233    12.5ms  stratum 2  ← 主（独立 IP）
#   ntp.tencent.com        106.55.184.199   37.3ms  stratum 2  ← 主（跨运营商）
#   cn.pool.ntp.org        116.203.151.74  156.4ms  ← 弃用：当前被解析到境外
#   ntp.ntsc.ac.cn         113.141.164.39  超时     ← 弃用：UDP 123 无响应
#   0.debian.pool.ntp.org  210.28.130.4     11.9ms  stratum 1  ← 保留作兜底
#
# 注意：FallbackNTP 只在 NTP= 全部不可达时启用；保留 Debian 官方 pool 可避免
#       国内源集体故障时完全没有时间源。不要直接改 /etc/systemd/timesyncd.conf，
#       用 drop-in 便于升级与回滚。

[Time]
NTP=ntp.aliyun.com ntp1.aliyun.com ntp.tencent.com
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org
